name: Build PDFs

on:
  push:
    branches: [main]
    paths:
      - "booking_sheet.tex"
      - "rider.tex"
      - "img/**"
      - ".github/workflows/build.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    # Full TeX Live install (includes Lora, XCharter and DejaVu as
    # texlive-managed font packages, so fontspec can find them by name).
    container:
      image: texlive/texlive:latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make sure required fonts are registered with fontconfig
        run: |
          set -e
          mkdir -p /usr/local/share/fonts
          # texlive/texlive ships Lora, XCharter and DejaVu inside its TeX
          # tree as texlive packages, but they aren't always pre-registered
          # with fontconfig. Copy whatever exists into a scanned dir, then
          # rebuild the cache, so fontspec (\IfFontExistsTF, \setmainfont)
          # can find them by family name.
          find / -path /proc -prune -o \( -iname "Lora*.otf" -o -iname "Lora*.ttf" \) -print 2>/dev/null \
            | xargs -r -I{} cp -n {} /usr/local/share/fonts/
          find / -path /proc -prune -o -iname "XCharter*.otf" -print 2>/dev/null \
            | xargs -r -I{} cp -n {} /usr/local/share/fonts/
          find / -path /proc -prune -o -iname "DejaVuSansCondensed*.ttf" -print 2>/dev/null \
            | xargs -r -I{} cp -n {} /usr/local/share/fonts/
          fc-cache -f
          echo "== Font availability =="
          fc-list | grep -i "Lora" || { echo "::error::Lora font not found anywhere in the image"; exit 1; }
          fc-list | grep -i "DejaVu Sans Condensed" || { echo "::error::DejaVu Sans Condensed not found anywhere in the image"; exit 1; }
          fc-list | grep -iE "Bitstream Charter|XCharter|: Charter:" || { echo "::error::No Charter-family font (Bitstream Charter / Charter / XCharter) found"; exit 1; }

      - name: Compile booking sheet (run twice for cross-references)
        run: |
          xelatex -interaction=nonstopmode booking_sheet.tex || true
          xelatex -interaction=nonstopmode booking_sheet.tex
          test -f booking_sheet.pdf || {
            echo "::error::$(tail -n 60 booking_sheet.log | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }

      - name: Compile technical rider (run twice for cross-references)
        run: |
          xelatex -interaction=nonstopmode rider.tex || true
          xelatex -interaction=nonstopmode rider.tex
          test -f rider.pdf || {
            echo "::error::$(tail -n 60 rider.log | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }

      - name: Rename PDFs to their display names
        run: |
          cp booking_sheet.pdf "Tromleorkestret - Booking Sheet.pdf"
          cp rider.pdf "Tromleorkestret - Technical Rider.pdf"

      - name: Commit updated PDFs
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "Tromleorkestret - Booking Sheet.pdf" "Tromleorkestret - Technical Rider.pdf"
          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
          else
            git commit -m "Auto-build PDFs [skip ci]"
            git push
          fi
