name: Build PDFs

on:
  push:
    branches: [main]
    paths:
      - "booking_sheet.tex"
      - "rider.tex"
      - "img/**"
      - ".github/workflows/build.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile booking sheet
        id: compile_booking_sheet
        continue-on-error: true
        uses: dante-ev/latex-action@latest
        with:
          root_file: booking_sheet.tex
          args: -pdfxe -latexoption=-file-line-error -latexoption=-interaction=nonstopmode
          extra_font_packages: fonts

      - name: Report booking sheet failure
        if: steps.compile_booking_sheet.outcome == 'failure'
        run: |
          echo "::error::booking_sheet.pdf failed to build. Log tail:%0A$(tail -n 60 booking_sheet.log 2>/dev/null | sed ':a;N;$!ba;s/\n/%0A/g')"
          exit 1

      - name: Compile technical rider
        id: compile_rider
        continue-on-error: true
        uses: dante-ev/latex-action@latest
        with:
          root_file: rider.tex
          args: -pdfxe -latexoption=-file-line-error -latexoption=-interaction=nonstopmode
          extra_font_packages: fonts

      - name: Report rider failure
        if: steps.compile_rider.outcome == 'failure'
        run: |
          echo "::error::rider.pdf failed to build. Log tail:%0A$(tail -n 60 rider.log 2>/dev/null | sed ':a;N;$!ba;s/\n/%0A/g')"
          exit 1

      - name: Rename and validate PDFs
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          cp booking_sheet.pdf "Tromleorkestret - Booking Sheet.pdf"
          cp rider.pdf "Tromleorkestret - Technical Rider.pdf"
          for f in "Tromleorkestret - Booking Sheet.pdf" "Tromleorkestret - Technical Rider.pdf"; do
            size=$(stat -c%s "$f")
            pages=$(pdfinfo "$f" 2>/dev/null | awk '/^Pages:/{print $2}')
            echo "$f: ${size} bytes, ${pages} pages"
            if [ "$size" -lt 200000 ] || [ "$pages" != "2" ]; then
              echo "::error::'$f' looks truncated or invalid (${size} bytes, ${pages} pages)"
              exit 1
            fi
          done

      - name: Commit updated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "Tromleorkestret - Booking Sheet.pdf" "Tromleorkestret - Technical Rider.pdf"
          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
          else
            git commit -m "Auto-build PDFs [skip ci]"
            git push
          fi
